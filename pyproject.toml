[project]
name = "chatbot"
version = "0.1.0"
description = "Simple stateless terminal chatbot using Gemini Interactions API"
readme = "README.md"
authors = [
    { name = "본인이름", email = "본인이메일@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
chatbot = "chatbot.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
